[project]
name = "cron-expression-parser"
version = "0.1.1"
description = "Parses standard five-field cron expressions into a set of next-fire times without external dependencies."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
